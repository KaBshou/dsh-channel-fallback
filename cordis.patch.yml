# 让 DeepSeek V4.1 Flash 优先走国际版（免费额度），用不了自动切国内版。
#
# 链会以「渠道链」分组出现在模型选择器里 —— 选中它才走链，不选不影响任何请求。
# 这两条链的 provider 由 channel-pack 注册（id 就是裸名），所以这里直接写裸名。
# 想改顺序 / 加第三个候选，改下面的 candidates 即可（改完重启 DSH 生效），
# 或者直接在设置页 →「渠道链」面板里改（改完立刻生效，不用重启）。
- insert:
    - id: channel-fallback
      name: dsh-channel-fallback
      config:
        enabled: true
        chains:
          # id 就是模型选择器里的 model id；不写会按 name 自动 slug 出同一个值。
          - id: flash-free-first
            name: flash-free-first
            candidates:
              - provider: workbuddy
                model: deepseek-v4.1-flash
              - provider: buddy
                model: deepseek-v4.1-flash
